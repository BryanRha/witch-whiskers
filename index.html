            font: 30px Jua, sans-serif; text-align: center; place-items: center; }
  #rotate b { display: block; font-size: 72px; margin-bottom: 12px; }
  @media (orientation: landscape) and (pointer: coarse) and (max-height: 560px) { #rotate { display: grid; } }
</style>
